services:
  db:
    image: postgres:16-alpine
    container_name: drd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drd_user
      POSTGRES_PASSWORD: drd_password
      POSTGRES_DB: drd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drd_user -d drd"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drd-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://drd_user:drd_password@db:5432/drd
      SECRET_KEY: production-evaluation-super-secret-key-drd-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drd-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
